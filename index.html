<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lizard Clicker</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(#fc7d7d,#f83b38);
    text-align:center;
    color:white;
}

h1{
    margin-top:20px;
}

#score{
    font-size:32px;
    font-weight:bold;
    margin:20px;
}

#axolotl{
    font-size:190px;
    cursor:pointer;
    user-select:none;
    transition:0.1s;
}

#axolotl:active{
    transform:scale(0.9);
}

.shop{
    background:rgba(255,255,255,0.15);
    width:320px;
    margin:20px auto;
    padding:20px;
    border-radius:20px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.bubble{
    position:absolute;
    font-size:30px;
    pointer-events:none;
    animation:floatUp 1s forwards;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-100px);
    }
}
</style>
</head>
<body>
<div id="score">0і</div>

<div id="axolotl">🦎</div>

<div class="shop">
    <h2>Shop</h2>

    <button onclick="buyClickUpgrade()">
        Algae (+1 per click) — <span id="clickCost">50</span>
    </button>

    <button onclick="buyAuto()">
        Baby-axolotl (+1/sec) — <span id="autoCost">100</span>
    </button>

    <p>Per click: <span id="perClick">1</span></p>
    <p>Per second: <span id="perSecond">0</span></p>
</div>




</body>
</html>
